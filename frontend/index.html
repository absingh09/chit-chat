<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>Connect — Real-Time Chat</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1120;color:#e5e7eb;font-family:system-ui,Arial,sans-serif}.app{width:100%;max-width:760px;height:min(780px,90vh);min-height:480px;display:flex;flex-direction:column;overflow:hidden;background:#111827;border:1px solid #293449;border-radius:18px}header{padding:20px;border-bottom:1px solid #293449;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 5px;font-size:21px}.subtitle,#status,#onlineCount{color:#9ca3af;font-size:12px}#status.connected{color:#4ade80}#status.error{color:#f87171}.join,#sendForm{display:flex;gap:8px;padding:14px 20px}.join{border-bottom:1px solid #293449}input,select,button{min-width:0;padding:12px;border:0;border-radius:9px;font:inherit}input,select{background:#1f2937;color:white;outline:1px solid #374151}input{flex:1}select{width:100%}button{background:#2563eb;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:85%;align-self:flex-start;padding:11px 14px;border-radius:4px 14px 14px 14px;background:#1f2937;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#1d4ed8;border-radius:14px 4px 14px 14px}.bubble.private{border:1px solid #c084fc}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:5px;font-size:12px;color:#bfdbfe}.tag{color:#e9d5ff;font-size:11px}.message-text{white-space:pre-wrap}.system,.error{align-self:center;text-align:center;font-size:12px}.system{color:#9ca3af}.error{color:#fca5a5}.recipient{padding:0 20px 14px;display:grid;gap:6px}label{font-size:12px;color:#9ca3af}#sendForm{border-top:1px solid #293449}#sendForm input{flex:1}.config-error{margin:12px 20px;padding:12px;border:1px solid #b91c1c;border-radius:8px;color:#fecaca;font-size:13px}@media(max-width:520px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0}header,.join,#sendForm{padding:12px}#messages{padding:14px}.recipient{padding:0 12px 12px}}

    /* --- Auth (login / signup) --- */
    [hidden]{display:none!important}
    .auth form{display:flex;flex-direction:column;gap:8px;width:100%}
    #userBar{justify-content:space-between;align-items:center;color:#9ca3af;font-size:13px}
    #userBar button{padding:8px 12px}
    button.link{background:none;color:#93c5fd;padding:4px;text-align:left}
    .error-text{color:#fca5a5;font-size:12px;min-height:16px}
  </style>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Connect 💬</h1>
      <div class="subtitle">Public and private messaging</div>
    </div>
    <div>
      <div id="status">Disconnected</div>
      <div id="onlineCount">0 online</div>
    </div>
  </header>

  <div id="configError" class="config-error" hidden></div>

  <!-- Shown when logged out -->
  <section id="authBox" class="join auth">
    <form id="authForm">
      <input id="authEmail" type="email" placeholder="Email" required autocomplete="email">
      <input id="authUsername" maxlength="20" placeholder="Choose a username (permanent)" hidden autocomplete="username">
      <input id="authPassword" type="password" minlength="6" placeholder="Password (min 6 characters)" required autocomplete="current-password">
      <button id="authSubmit" type="submit">Log in</button>
      <button id="authToggle" type="button" class="link">New here? Create account</button>
      <div id="authMsg" class="error-text" aria-live="polite"></div>
    </form>
  </section>

  <!-- Shown when logged in -->
  <div id="userBar" class="join" hidden>
    <span id="whoami"></span>
    <button id="logoutBtn" type="button">Log out</button>
  </div>

  <section id="messages" aria-live="polite"><div class="system">Log in or create an account to start chatting.</div></section>

  <div class="recipient">
    <label for="recipient">Send message to</label>
    <select id="recipient" disabled><option value="">Everyone (public)</option></select>
  </div>

  <form id="sendForm">
    <input id="messageInput" maxlength="2000" placeholder="Write a message..." disabled required>
    <button id="sendButton" type="submit" disabled>Send</button>
  </form>
</main>

<script>
  const $ = id => document.getElementById(id);
  const status = $('status'), onlineCount = $('onlineCount'), messages = $('messages'),
        recipientSelect = $('recipient'), sendForm = $('sendForm'), messageInput = $('messageInput'), sendButton = $('sendButton');
  let socket = null, currentUsername = '';

  const backend = (window.CHAT_BACKEND_URL || '').trim().replace(/\/$/, '');

  // Supabase client (null if config.js is missing the keys)
  const sb = (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY)
    ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
    : null;

  const authBox = $('authBox'), authForm = $('authForm'), authEmail = $('authEmail'), authPassword = $('authPassword'),
        authUsername = $('authUsername'), authSubmit = $('authSubmit'), authToggle = $('authToggle'), authMsg = $('authMsg'),
        userBar = $('userBar'), whoami = $('whoami'), logoutBtn = $('logoutBtn');
  let signupMode = false;

  function showConfigError(text) {
    const box = $('configError');
    box.hidden = false;
    box.textContent = text;
  }

  function notice(message, type = 'system') {
    const el = document.createElement('div');
    el.className = type;
    el.textContent = message;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  function chatMessage(data) {
    const isPrivate = data.type === 'private', mine = data.username === currentUsername;
    const bubble = document.createElement('article');
    bubble.className = 'bubble' + (mine ? ' mine' : '') + (isPrivate ? ' private' : '');
    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('strong');
    name.textContent = data.username;
    const time = document.createElement('span');
    const date = new Date(data.timestamp);
    time.textContent = Number.isNaN(date.getTime()) ? '' : date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.append(name, time);
    if (isPrivate) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = mine ? `🔒 To ${data.recipient}` : '🔒 Private message';
      meta.append(tag);
    }
    const text = document.createElement('div');
    text.className = 'message-text';
    text.textContent = data.message;
    bubble.append(meta, text);
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;
  }

  function updateUsers(users) {
    const previous = recipientSelect.value;
    recipientSelect.replaceChildren();
    const everyone = document.createElement('option');
    everyone.value = '';
    everyone.textContent = 'Everyone (public)';
    recipientSelect.appendChild(everyone);
    for (const username of users) {
      if (username.toLowerCase() === currentUsername.toLowerCase()) continue;
      const option = document.createElement('option');
      option.value = username;
      option.textContent = username;
      recipientSelect.appendChild(option);
    }
    if ([...recipientSelect.options].some(o => o.value === previous)) recipientSelect.value = previous;
    onlineCount.textContent = `${users.length} online`;
  }

  /* ---------- Auth UI ---------- */
  function setAuthMode(signup) {
    signupMode = signup;
    authUsername.hidden = !signup;
    authUsername.required = signup;
    authPassword.autocomplete = signup ? 'new-password' : 'current-password';
    authSubmit.textContent = signup ? 'Create account' : 'Log in';
    authToggle.textContent = signup ? 'Already have an account? Log in' : 'New here? Create account';
    authMsg.textContent = '';
  }
  authToggle.addEventListener('click', () => setAuthMode(!signupMode));

  /* ---------- WebSocket connection ---------- */
  async function connect(username) {
    if (!backend || backend.includes('YOUR-RENDER-SERVICE')) {
      showConfigError('Deployment setup required: edit frontend/config.js and set your actual Render backend URL.');
      return;
    }
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      authMsg.textContent = 'Session expired. Please log in again.';
      authBox.hidden = false;
      userBar.hidden = true;
      return;
    }

    currentUsername = username;
    const wsBase = backend.replace(/^https:/, 'wss:').replace(/^http:/, 'ws:');
    status.textContent = 'Connecting...';
    status.className = '';
    socket = new WebSocket(`${wsBase}/ws/${encodeURIComponent(username)}`);

    socket.onopen = () => {
      // First message proves who you are. (Current backend ignores it; Phase 3 backend will verify it.)
      socket.send(JSON.stringify({ type: 'auth', token: session.access_token }));
      status.textContent = 'Connected';
      status.className = 'connected';
      recipientSelect.disabled = false;
      messageInput.disabled = false;
      sendButton.disabled = false;
      messageInput.focus();
    };

    socket.onmessage = e => {
      let data;
      try { data = JSON.parse(e.data) } catch { return }
      if (data.type === 'users') updateUsers(data.users);
      else if (data.type === 'system') notice(data.message);
      else if (data.type === 'error') notice(data.message, 'error');
      else if (data.type === 'chat' || data.type === 'private') chatMessage(data);
      else if (data.type === 'history' && Array.isArray(data.messages)) {
        data.messages.forEach(chatMessage);
        if (data.messages.length) notice('— Earlier messages loaded —');
      }
    };

    socket.onerror = () => {
      status.textContent = 'Connection error';
      status.className = 'error';
    };

    socket.onclose = () => {
      status.textContent = 'Disconnected';
      status.className = 'error';
      recipientSelect.disabled = true;
      messageInput.disabled = true;
      sendButton.disabled = true;
      recipientSelect.replaceChildren();
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'Everyone (public)';
      recipientSelect.appendChild(opt);
      onlineCount.textContent = '0 online';
    };
  }

  /* ---------- Login / signup flow ---------- */
  async function enterChat(user) {
    const { data, error } = await sb.from('profiles').select('username').eq('id', user.id).single();
    if (error || !data) {
      authMsg.textContent = 'Could not load your profile. Try again.';
      return;
    }
    authBox.hidden = true;
    userBar.hidden = false;
    whoami.textContent = 'Logged in as ' + data.username;
    messages.replaceChildren();
    await connect(data.username);
  }

  authForm.addEventListener('submit', async e => {
    e.preventDefault();
    authMsg.textContent = '';
    if (!sb) {
      showConfigError('Supabase is not configured. Check SUPABASE_URL and SUPABASE_ANON_KEY in frontend/config.js.');
      return;
    }
    authSubmit.disabled = true;
    const email = authEmail.value.trim(), password = authPassword.value;
    try {
      if (signupMode) {
        const username = authUsername.value.trim();
        if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
          authMsg.textContent = 'Username: 3-20 letters, numbers or underscore.';
          return;
        }
        const { data: free, error: e1 } = await sb.rpc('username_available', { name: username });
        if (e1) { authMsg.textContent = e1.message; return; }
        if (!free) { authMsg.textContent = 'That username is already taken.'; return; }
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
        if (error) { authMsg.textContent = error.message; return; }
        if (!data.session) {
          authMsg.textContent = 'Account created. Please log in.';
          setAuthMode(false);
          return;
        }
        await enterChat(data.user);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { authMsg.textContent = error.message; return; }
        await enterChat(data.user);
      }
    } finally {
      authSubmit.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async () => {
    if (sb) await sb.auth.signOut();
    if (socket) socket.close();
    userBar.hidden = true;
    authBox.hidden = false;
    authPassword.value = '';
    messages.replaceChildren();
    notice('You have logged out.');
  });

  /* ---------- Send message ---------- */
  sendForm.addEventListener('submit', e => {
    e.preventDefault();
    const message = messageInput.value.trim();
    if (!message || !socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify({ message, recipient: recipientSelect.value || null }));
    messageInput.value = '';
    messageInput.focus();
  });

  /* ---------- Auto-login if a session already exists ---------- */
  (async () => {
    if (!sb) return;
    const { data } = await sb.auth.getSession();
    if (data.session) await enterChat(data.session.user);
  })();
</script>
</body>
</html>
