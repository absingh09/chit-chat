<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>Connect — Real-Time Chat</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1120;color:#e5e7eb;font-family:system-ui,Arial,sans-serif}.app{width:100%;max-width:760px;height:min(780px,90vh);min-height:480px;display:flex;flex-direction:column;overflow:hidden;background:#111827;border:1px solid #293449;border-radius:18px}header{padding:20px;border-bottom:1px solid #293449;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 5px;font-size:21px}.subtitle,#status,#onlineCount{color:#9ca3af;font-size:12px}#status.connected{color:#4ade80}#status.error{color:#f87171}.join,#sendForm{display:flex;gap:8px;padding:14px 20px}.join{border-bottom:1px solid #293449}input,select,button{min-width:0;padding:12px;border:0;border-radius:9px;font:inherit}input,select{background:#1f2937;color:white;outline:1px solid #374151}input{flex:1}select{width:100%}button{background:#2563eb;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:85%;align-self:flex-start;padding:11px 14px;border-radius:4px 14px 14px 14px;background:#1f2937;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#1d4ed8;border-radius:14px 4px 14px 14px}.bubble.private{border:1px solid #c084fc}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:5px;font-size:12px;color:#bfdbfe}.tag{color:#e9d5ff;font-size:11px}.message-text{white-space:pre-wrap}.system,.error{align-self:center;text-align:center;font-size:12px}.system{color:#9ca3af}.error{color:#fca5a5}.recipient{padding:0 20px 14px;display:grid;gap:6px}label{font-size:12px;color:#9ca3af}#sendForm{border-top:1px solid #293449}#sendForm input{flex:1}.config-error{margin:12px 20px;padding:12px;border:1px solid #b91c1c;border-radius:8px;color:#fecaca;font-size:13px}@media(max-width:520px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0}header,.join,#sendForm{padding:12px}#messages{padding:14px}.recipient{padding:0 12px 12px}}
  </style>
  <script src="/config.js"></script>
</head>
<body>
<main class="app">
  <header><div><h1>Connect 💬</h1><div class="subtitle">Public and private messaging</div></div><div><div id="status">Disconnected</div><div id="onlineCount">0 online</div></div></header>
  <div id="configError" class="config-error" hidden></div>
  <form id="joinForm" class="join"><input id="username" maxlength="25" placeholder="Choose a username" required><button id="joinButton" type="submit">Join</button></form>
  <section id="messages" aria-live="polite"><div class="system">Join the chat to get started.</div></section>
  <div class="recipient"><label for="recipient">Send message to</label><select id="recipient" disabled><option value="">Everyone (public)</option></select></div>
  <form id="sendForm"><input id="messageInput" maxlength="2000" placeholder="Write a message..." disabled required><button id="sendButton" type="submit" disabled>Send</button></form>
</main>
<script>
  const $=id=>document.getElementById(id);const status=$('status'),onlineCount=$('onlineCount'),joinForm=$('joinForm'),usernameInput=$('username'),joinButton=$('joinButton'),messages=$('messages'),recipientSelect=$('recipient'),sendForm=$('sendForm'),messageInput=$('messageInput'),sendButton=$('sendButton');let socket=null,currentUsername='';
  const backend=(window.CHAT_BACKEND_URL||'').trim().replace(/\/$/,'');
  function notice(message,type='system'){const el=document.createElement('div');el.className=type;el.textContent=message;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;}
  function chatMessage(data){const isPrivate=data.type==='private',mine=data.username===currentUsername;const bubble=document.createElement('article');bubble.className='bubble'+(mine?' mine':'')+(isPrivate?' private':'');const meta=document.createElement('div');meta.className='meta';const name=document.createElement('strong');name.textContent=data.username;const time=document.createElement('span');const date=new Date(data.timestamp);time.textContent=Number.isNaN(date.getTime())?'':date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});meta.append(name,time);if(isPrivate){const tag=document.createElement('span');tag.className='tag';tag.textContent=mine?`🔒 To ${data.recipient}`:'🔒 Private message';meta.append(tag)}const text=document.createElement('div');text.className='message-text';text.textContent=data.message;bubble.append(meta,text);messages.appendChild(bubble);messages.scrollTop=messages.scrollHeight;}
  function updateUsers(users){const previous=recipientSelect.value;recipientSelect.replaceChildren();const everyone=document.createElement('option');everyone.value='';everyone.textContent='Everyone (public)';recipientSelect.appendChild(everyone);for(const username of users){if(username.toLowerCase()===currentUsername.toLowerCase())continue;const option=document.createElement('option');option.value=username;option.textContent=username;recipientSelect.appendChild(option)}if([...recipientSelect.options].some(o=>o.value===previous))recipientSelect.value=previous;onlineCount.textContent=`${users.length} online`;}
  joinForm.addEventListener('submit',e=>{e.preventDefault();const username=usernameInput.value.trim();if(!backend||backend.includes('YOUR-RENDER-SERVICE')){const box=$('configError');box.hidden=false;box.textContent='Deployment setup required: edit frontend/config.js and set your actual Render backend URL.';return}if(!username||username.length>25)return;if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING))return;currentUsername=username;const wsBase=backend.replace(/^https:/,'wss:').replace(/^http:/,'ws:');status.textContent='Connecting...';status.className='';joinButton.disabled=true;socket=new WebSocket(`${wsBase}/ws/${encodeURIComponent(username)}`);socket.onopen=()=>{status.textContent='Connected';status.className='connected';usernameInput.disabled=true;recipientSelect.disabled=false;messageInput.disabled=false;sendButton.disabled=false;messageInput.focus()};socket.onmessage=e=>{let data;try{data=JSON.parse(e.data)}catch{return}if(data.type==='users')updateUsers(data.users);else if(data.type==='system')notice(data.message);else if(data.type==='error')notice(data.message,'error');else if(data.type==='chat'||data.type==='private')chatMessage(data)};socket.onerror=()=>{status.textContent='Connection error';status.className='error'};socket.onclose=()=>{status.textContent='Disconnected';status.className='error';joinButton.disabled=false;usernameInput.disabled=false;recipientSelect.disabled=true;messageInput.disabled=true;sendButton.disabled=true;recipientSelect.replaceChildren();const opt=document.createElement('option');opt.value='';opt.textContent='Everyone (public)';recipientSelect.appendChild(opt);onlineCount.textContent='0 online';}});
  sendForm.addEventListener('submit',e=>{e.preventDefault();const message=messageInput.value.trim();if(!message||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({message,recipient:recipientSelect.value||null}));messageInput.value='';messageInput.focus()});
</script>
</body>
</html>
